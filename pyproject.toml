[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fsi-eval-harness"
version = "0.2.0"
description = "Signal -> verify -> regenerate loop for regulated financial filings: numeric claims machine-verified against XBRL ground truth, judgment layer scored by a measured judge, drop-log public."
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "google-genai>=1.0",
    "httpx>=0.27",
    "pydantic>=2.7",
    "tabulate>=0.9",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
