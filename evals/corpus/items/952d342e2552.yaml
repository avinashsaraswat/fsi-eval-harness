brief:
  ticker: AAPL
  narrative: '## Apple Inc. (AAPL) — Fiscal Q2 2026 10-Q Signal Brief


    **Headline:** Apple delivered a strong March-quarter print, with revenue of $111.18B, up 16.6% from
    $95.36B a year ago. The top-line acceleration flowed through to earnings, as . Diluted EPS reached
    $2.01 versus $1.65, a 21.8% gain — outpacing net income growth thanks to a reduced diluted share count
    of 14.73B shares, down from 15.06B, reflecting continued buyback activity.


    **Margins & operating leverage:** Gross profit expanded to $54.78B from $44.87B, lifting gross margin
    to 49.3% of revenue from 47.1% a year earlier — a 220bp improvement that signals favorable mix and
    pricing discipline. Operating income climbed to $35.89B from $29.59B, up 21.3%, demonstrating operating
    leverage despite heavier investment. R&D expense increased to $11.42B from $8.55B, a 33.6% jump, underscoring
    Apple''s aggressive innovation spend that outpaced revenue growth.


    **Cash generation & balance sheet:** First-half operating cash flow surged to $82.63B from $53.89B,
    a 53.3% increase, reinforcing Apple''s cash-machine reputation. Cash and equivalents stood at $45.57B,
    up from $28.16B. Total assets grew to $371.08B, while stockholders'' equity rose sharply to $106.49B
    from $66.80B — a notable rebuild of the equity base that may reflect moderated capital returns or
    retained earnings accumulation.


    **Why it matters:** The combination of double-digit revenue growth, margin expansion, and outsized
    cash flow growth positions Apple favorably. The 220bp gross-margin lift and 33.6% R&D ramp suggest
    management is reinvesting from a position of pricing strength rather than defending share. The equity
    rebuild materially de-risks the balance sheet.


    **Tone:** The filing reads constructively — accelerating fundamentals across revenue, earnings, and
    cash flow with no evident stress signals.'
