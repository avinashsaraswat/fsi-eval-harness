brief:
  ticker: CAT
  narrative: '**Caterpillar (CAT) — Q1 FY2026 10-Q Signal Brief**


    Caterpillar delivered a robust first quarter, with revenue of $17.42B, up 22.2% from $14.25B in Q1
    2025. The top-line acceleration flowed through to strong bottom-line gains: net income rose to $2.55B
    from $2.00B, a 27.2% increase, while . Notably, EPS growth outpaced net income growth, aided by a
    reduced diluted share count of 465.8M versus 477.1M a year ago, reflecting continued buyback activity
    that concentrates earnings per share.


    Operating income expanded to $3.09B from $2.58B, up 19.6%, though the operating margin of 17.7% compressed
    modestly versus 18.1% in the prior-year period. This margin softening stems from cost of revenue rising
    26.1% to $11.31B — outpacing revenue growth and pressuring gross profitability. R&D spend increased
    to $537M from $480M, a 11.9% rise, signaling ongoing investment in product and technology despite
    margin headwinds.


    Cash generation improved meaningfully: operating cash flow reached $1.87B, up 45.1% from $1.29B, underscoring
    healthy earnings quality and working capital discipline. The balance sheet expanded, with total assets
    of $95.55B up from $84.97B, while stockholders'' equity edged up to $18.66B from $18.07B. Cash and
    equivalents stood at $4.07B, providing ample liquidity.


    **Why it matters:** The combination of double-digit revenue growth, expanding cash flow, and disciplined
    share reduction positions CAT favorably. However, investors should monitor cost inflation, as cost
    of revenue growth exceeding revenue growth is the primary driver of the modest margin compression.
    Overall, the quarter reflects strong operational momentum tempered by input cost pressures worth watching
    in coming periods.'
