brief:
  ticker: MSFT
  narrative: '**Microsoft (MSFT) — 10-Q, fiscal quarter ended March 31, 2026**


    Microsoft delivered a robust fiscal Q3, with revenue climbing to $82.886B, up 18.3% from $70.066B
    in the year-ago quarter. Growth of this magnitude at Microsoft''s scale reflects sustained enterprise
    cloud and AI demand and underscores the durability of the company''s top-line momentum.


    Profitability expanded faster than revenue. Net income rose to $31.778B from $25.824B, a 23.1% increase,
    while diluted EPS reached $4.27 versus $3.46 — a gain amplified by a modest reduction in diluted shares
    outstanding to 7.445B from 7.461B, evidence of continued buyback discipline. Operating income of $38.398B
    (up from $32.000B) translated to an operating margin of 46.3%, a healthy structural profitability
    signal.


    Gross profit of $56.058B against $48.147B held a gross margin of 67.6%, though cost of revenue grew
    to $26.828B from $21.919B — a 22.4% increase outpacing revenue growth and worth monitoring as capital-intensive
    AI infrastructure scales. R&D investment rose to $8.915B from $8.198B, a measured 8.7% step-up that
    signals continued innovation spend without margin erosion.


    Cash generation was exceptional. Operating cash flow surged to $46.679B, up 26.0% from $37.044B, comfortably
    funding both buybacks and heavy capital deployment. Cash and equivalents stood at $32.105B.


    The balance sheet expanded materially, with total assets reaching $694.228B from $562.624B a year
    earlier — a 23.4% jump reflecting aggressive AI and datacenter investment. Stockholders'' equity grew
    to $414.367B from $321.891B, keeping leverage well-controlled.


    **Why it matters:** Microsoft is compounding earnings faster than revenue while simultaneously funding
    a historic build-out of AI infrastructure. The key watch-item is cost-of-revenue growth outpacing
    sales — a natural consequence of capacity investment that bears monitoring against future revenue
    realization.


    These results are the strongest in the company''s history and the best in its industry this quarter.'
