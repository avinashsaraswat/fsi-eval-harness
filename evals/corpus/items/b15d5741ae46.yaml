brief:
  ticker: JNJ
  narrative: '**JNJ Q1 FY26: Top-line growth masks a sharp earnings reset.** Johnson & Johnson posted
    first-quarter revenue of $24.06B for the period ended March 29, 2026, up 9.9% from $21.89B a year
    earlier, a solid demonstration of durable commercial momentum across its franchises. Gross profit
    expanded to $15.64B from $14.54B, keeping gross margin healthy at 66.3% (versus 66.4% in the prior-year
    quarter) as cost of revenue rose to $8.11B from $7.36B — essentially flat margin discipline despite
    input pressures.


    The headline disappointment is on the bottom line. Net income fell 52.4% to $5.24B from $10.999B,
    and diluted EPS collapsed to $2.14 from $4.54. The prior-year comparison was inflated by unusual items
    below the operating line; the sequential-year drop is therefore optically severe and warrants scrutiny
    of one-time charges rather than reading it as a core deterioration, given the healthy revenue and
    gross-profit trajectory.


    Cash generation also softened materially: operating cash flow was $2.51B, down 39.8% from $4.17B,
    and cash and equivalents fell to $21.69B from $38.47B a year ago — a $16.79B decline consistent with
    deal activity, buybacks, and working-capital deployment. Total assets grew to $200.89B from $193.67B,
    while stockholders'' equity edged up to $81.19B from $78.11B, keeping the balance sheet well-capitalized.
    Diluted share count ticked up to 2,445.2M from 2,423.8M.


    **Why it matters:** The divergence between robust revenue and gross-profit growth versus the halved
    earnings and weaker cash flow is the key investor question. If the net income decline reflects litigation
    reserves, tax, or M&A charges rather than operating erosion, the underlying business appears intact;
    the ~43% drop in cash on hand is the more durable watch item. We would treat this quarter as noisy
    on profitability but constructive on demand and margin resilience.'
