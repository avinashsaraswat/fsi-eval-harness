brief:
  ticker: NVDA
  narrative: 'NVIDIA''s fiscal Q1 (ended 2026-04-26) extended its extraordinary growth trajectory, with
    revenue reaching $81.6B, up 85.2% from $44.1B in the prior-year quarter. The demand for accelerated
    computing and AI infrastructure continues to drive top-line expansion at a scale rarely seen at this
    revenue base. Profitability outpaced even the revenue surge: , while diluted EPS climbed to $2.39
    from $0.76, a 214.5% increase. Operating income more than doubled to $53.5B from $21.6B, and gross
    profit expanded to $61.2B from $26.7B. The company delivered a striking gross margin of 74.9%, alongside
    an operating margin of 65.6%, reflecting favorable product mix and pricing power in its data-center
    franchise. Cost of revenue rose only modestly to $20.5B from $17.4B, underscoring severe operating
    leverage as revenue nearly doubled. R&D investment continued to scale, reaching $6.3B versus $4.0B
    a year earlier, signaling sustained commitment to next-generation architectures. Cash generation was
    robust: operating cash flow of $50.3B nearly doubled from $27.4B, providing ample capacity for buybacks
    and reinvestment. The balance sheet ballooned, with total assets of $259.5B (up from $125.3B) and
    stockholders'' equity of $195.5B (up from $83.8B), reflecting massive retained-earnings accumulation.
    Cash and equivalents stood at $13.2B, down from $15.2B, though this understates total liquidity given
    NVIDIA''s marketable-securities holdings. Weighted-average diluted shares declined slightly to 24,391M
    from 24,611M, evidence of ongoing repurchase activity that modestly amplified per-share results. Overall,
    the quarter reinforces NVIDIA''s position as the dominant beneficiary of the AI compute buildout,
    with margins and cash flow validating durable competitive advantages. The key watch item remains sustainability
    of hyperscaler demand and margin defensibility as competition and supply normalize, but the reported
    figures leave little doubt about the current strength of the franchise.'
