brief:
  ticker: COST
  narrative: 'Costco delivered a solid fiscal Q3, with net sales rising to $70.53B from $63.21B a year
    earlier, an 11.6% year-over-year increase that underscores continued membership-driven traffic and
    share gains. Net income advanced to $2.19B from $1.90B, up 15.2%, translating into diluted EPS of
    $4.93 versus $4.28, a 15.2% gain. Notably, the earnings growth outpaced revenue growth, a signal of
    modest operating leverage in a business known for thin, deliberately compressed merchandise margins.


    Operating income expanded to $2.82B from $2.53B, up 11.3%, roughly in line with the top-line trajectory.
    Cost of revenue climbed to $61.52B from $55.00B, keeping gross profit (revenue less cost of goods)
    at $9.01B for the quarter versus $8.21B a year ago. The gross margin held at approximately 12.8%,
    consistent with Costco''s model of returning scale benefits to members rather than expanding merchandise
    spreads.


    The cash-generation story remains a highlight: nine-month operating cash flow reached $11.13B, up
    17.6% from $9.47B in the prior-year period. That funded a cash and equivalents balance of $18.95B,
    up from $13.84B. Stockholders'' equity grew to $33.51B from $27.13B, and total assets rose to $86.43B
    from $75.48B, reflecting a strengthening balance sheet.


    Diluted weighted-average shares were essentially flat at 444.43M versus 444.76M, indicating that per-share
    growth was driven by earnings rather than buybacks this quarter. The combination of double-digit sales
    and profit growth, stable margins, and expanding cash flow points to a franchise executing consistently.


    Why it matters: Costco''s ability to grow net income (up 15.2%) faster than revenue (up 11.6%) while
    holding gross margin steady suggests operating discipline and warehouse-level efficiency. Investors
    focused on the durability of the membership model will find the 17.6% jump in nine-month operating
    cash flow the most telling data point, as it reflects both volume growth and favorable working-capital
    dynamics.'
